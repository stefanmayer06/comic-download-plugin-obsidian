name: Release

# Publishes a GitHub release with main.js, manifest.json and styles.css,
# which is what BRAT installs from. Start it any of these ways:
# - push a tag that matches the version in manifest.json (e.g. 0.1.0, no "v")
# - create a release with that tag on GitHub's website; the build is
#   attached to it
# - press "Run workflow" on the Actions tab, which tags the selected
#   branch with the version in manifest.json
on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Work out version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./manifest.json').version")"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest.json version $version"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] &&
            gh release view "$version" --json assets --jq '.assets[].name' 2> /dev/null | grep -qx main.js; then
            echo "::error::Version $version is already released. Bump it with npm version first."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$VERSION" > /dev/null 2>&1; then
            # The release was created on GitHub's website: attach the build to it.
            gh release upload "$VERSION" main.js manifest.json styles.css --clobber
          else
            gh release create "$VERSION" \
              --target "$GITHUB_SHA" \
              --title "$VERSION" \
              --generate-notes \
              main.js manifest.json styles.css
          fi
